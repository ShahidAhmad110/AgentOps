[project]
name = "agentops"
version = "0.1.0"
description = "AgentOps platform foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"alembic>=1.16,<2.0",
	"asyncpg>=0.30,<1.0",
	"fastapi>=0.115,<1.0",
	"langgraph>=0.6,<1.0",
	"pypdf>=5.0,<7.0",
	"pydantic-settings>=2.8,<3.0",
	"python-multipart>=0.0.20,<1.0",
	"sqlalchemy[asyncio]>=2.0,<3.0",
	"uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28,<1.0",
	"pytest>=8.3,<9.0",
	"pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
